<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>使用模式与网络设置</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f5;color:#17231f;font:14px system-ui,"Microsoft YaHei"}.wrap{padding:26px}h1{font-size:22px;margin:0 0 6px}p{margin:0 0 18px;color:#66756f;line-height:1.55}.modes{display:grid;gap:9px}.mode{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:13px;border:1px solid #d4dfdb;border-radius:10px;background:#fff;cursor:pointer}.mode:has(input:checked){border-color:#07875f;box-shadow:0 0 0 3px #07875f18}.mode strong{display:block}.mode span{display:block;margin-top:3px;color:#718078;font-size:12px}.panel{margin-top:15px;padding:15px;border-radius:10px;background:#fff}.field{margin-bottom:13px}label{display:block;font-weight:700;margin-bottom:6px}input{width:100%;border:1px solid #cad7d2;border-radius:8px;padding:10px 12px;font:inherit}.row,.path-row{display:grid;grid-template-columns:1fr 120px;gap:10px}.hidden{display:none}.code{font:12px ui-monospace,monospace;word-break:break-all;background:#edf4f1;padding:9px;border-radius:7px}.buttons,.actions{display:flex;gap:9px;flex-wrap:wrap}.actions{justify-content:flex-end;margin-top:18px}button{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}.secondary{background:#e8eeeb;color:#34443e}.primary{background:#07875f;color:#fff}.status{min-height:20px;margin-top:10px;color:#b42318}
</style></head><body><div class="wrap"><h1>使用模式与网络设置</h1><p>默认本机独立使用；需要多人协作时，可把一台电脑设为主机，其他电脑通过连接码加入。</p>
<div class="modes"><label class="mode"><input type="radio" name="mode" value="local"><div><strong>本机使用（推荐默认）</strong><span>数据和文件只保存在这台电脑，不依赖 NAS 或网络。</span></div></label><label class="mode"><input type="radio" name="mode" value="host"><div><strong>固定共享主机 / NAS 数据</strong><span>只在这一台电脑运行服务，可选用现有 3.0 NAS 数据目录供局域网电脑连接。</span></div></label><label class="mode"><input type="radio" name="mode" value="remote"><div><strong>连接已有主机</strong><span>本机不保存业务数据，通过 IP 或连接码访问唯一主机。</span></div></label></div>
<div class="panel" id="localPanel"><strong>本机数据位置</strong><p>数据保存在当前 Windows 用户的应用数据目录，安装升级不会删除。</p></div>
<div class="panel hidden" id="hostPanel"><div class="field"><label>3.0/4.0 业务数据目录</label><div class="path-row"><input id="dataDir" placeholder="留空继续使用本机数据；正式部署填写 NAS 绝对路径或 UNC"><button class="secondary" id="browseData" type="button">选择</button></div></div><div class="field"><label>项目附件目录</label><div class="path-row"><input id="archiveDir" placeholder="NAS 上已有的项目附件目录"><button class="secondary" id="browseArchive" type="button">选择</button></div></div><p>填写 NAS 路径时两项必须同时存在，且业务目录必须包含 3.0 核心 JSON。系统不会自动创建一个空的正式库。</p><div class="field"><label>共享端口</label><input id="hostPort" type="number" min="1" max="65535" value="32100"></div><div class="field"><label>本机局域网地址</label><div id="addresses"></div></div><div class="field"><label>给其他电脑的连接码</label><div class="code" id="connectionCode">保存主机模式后生成</div></div><div class="buttons"><button class="secondary" id="copyCode">复制连接码</button><button class="secondary" id="firewall">允许局域网访问</button></div></div>
<div class="panel hidden" id="remotePanel"><div class="field"><label>粘贴连接码</label><div class="row"><input id="joinCode" placeholder="由主机电脑复制"><button class="secondary" id="applyCode">读取</button></div></div><div class="row"><div class="field"><label>主机 / NAS IP</label><input id="host" placeholder="例如 192.168.1.3"></div><div class="field"><label>端口</label><input id="port" type="number" min="1" max="65535" value="3000"></div></div></div>
<div class="status" id="status"></div><div class="actions"><button class="secondary" onclick="window.close()">取消</button><button class="primary" id="save">保存并切换</button></div></div><script>
const q=s=>document.querySelector(s),status=q('#status');function mode(){return q('input[name=mode]:checked').value}function render(){const m=mode();q('#localPanel').classList.toggle('hidden',m!=='local');q('#hostPanel').classList.toggle('hidden',m!=='host');q('#remotePanel').classList.toggle('hidden',m!=='remote')}
window.nasSettings.get().then(v=>{q(`input[value=${v.mode}]`).checked=true;q('#host').value=v.host||'';q('#port').value=v.mode==='remote'?v.port:3000;q('#hostPort').value=v.mode==='host'?v.port:32100;q('#dataDir').value=v.dataDir||'';q('#archiveDir').value=v.archiveDir||'';q('#addresses').innerHTML=(v.addresses||[]).map(x=>`<div class="code">${x.url}</div>`).join('')||'未检测到局域网地址';q('#connectionCode').textContent=v.connectionCode||'保存主机模式后生成';render()}).catch(e=>{status.textContent=e.message||'读取设置失败'});
document.querySelectorAll('input[name=mode]').forEach(x=>x.addEventListener('change',render));
q('#applyCode').onclick=async()=>{try{const v=await window.nasSettings.decode(q('#joinCode').value);q('input[value=remote]').checked=true;q('#host').value=v.host;q('#port').value=v.port;render();status.textContent='连接码已读取，请保存并切换'}catch(e){status.textContent=e.message}};
q('#browseData').onclick=async()=>{const value=await window.nasSettings.chooseDirectory();if(value)q('#dataDir').value=value};q('#browseArchive').onclick=async()=>{const value=await window.nasSettings.chooseDirectory();if(value)q('#archiveDir').value=value};
q('#copyCode').onclick=async()=>{const code=q('#connectionCode').textContent;if(code&&!code.includes('保存')){await navigator.clipboard.writeText(code);status.textContent='连接码已复制'}};
q('#firewall').onclick=async()=>{status.textContent='请在弹出的 Windows 窗口中允许更改…';const r=await window.nasSettings.firewall(Number(q('#hostPort').value));status.textContent=r.message};
q('#save').onclick=async()=>{status.textContent='正在切换…';try{const m=mode();await window.nasSettings.save({mode:m,host:q('#host').value,port:m==='remote'?Number(q('#port').value):m==='host'?Number(q('#hostPort').value):32100,dataDir:q('#dataDir').value,archiveDir:q('#archiveDir').value});window.close()}catch(e){status.textContent=e.message||'保存失败'}};
</script></body></html>
